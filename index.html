<!DOCTYPE html>
<html>
  <head>
    <title>Проект "Комменты"</title>
    <meta charset="utf-8" />
    <link rel="stylesheet" href="styles.css" />
  </head>

  <body>
    <div class="container">
      <ul class="comments"></ul>

      <div class="add-form">
        <input
          type="text"
          class="add-form-name"
          placeholder="Введите ваше имя"
        />
        <textarea
          type="textarea"
          class="add-form-text"
          placeholder="Введите ваш коментарий"
          rows="4"
        ></textarea>
        <div class="add-form-row">
          <button class="add-form-button">Написать</button>
        </div>
      </div>
    </div>
  </body>

  <script>
    "use strict"; 
    const comments = [
      {name: "Глеб Фокин", data: "12.02.22 12:18", text: "Это будет первый комментарий на этой странице", counter: 3, like: false},
      {name: "Варвара Н.", data: "13.02.22 19:22", text: "Мне нравится как оформлена эта страница! ❤", counter: 75, like: true}
    ];
    
    const commentRendering = () => {
      const listEl = document.querySelector('.comments');

      const render = comments.map((comment, index) => {
        return `<li class="comment">
          <div class="comment-header">
            <div>${comment.name}</div>
            <div>${comment.data}</div>
          </div>
          <div class="comment-body">
            <div class="comment-text">
              ${comment.text}
            </div>
          </div>
          <div class="comment-footer">
            <div class="likes">
              <span class="likes-counter" data-index="${index}">${comment.counter}</span>
              <button class="like-button ${comment.like ? '-active-like' : ''}"></button>
            </div>
          </div>
        </li>`
      }).join("");
      
      listEl.innerHTML = render;
    };
    
    const likeButtons = () => {
      const likeBtns = document.querySelectorAll('.like-button');
      
      likeBtns.forEach(el => {
        el.addEventListener('click', function() {
          const commentEl = this.parentElement.querySelector('.likes-counter');
          const index = commentEl.dataset.index;
          const comment = comments[index];
          
          if (comment.like) {
              comment.like = false;
              comment.counter--;
          } else {
              comment.like = true;
              comment.counter++;
          }
          
          commentRendering();
          likeButtons();
        });
      });
    };
    
    const newComment = () => {
      const nameEl = document.querySelector('.add-form-name');
      const textEl = document.querySelector('.add-form-text');
      const addBtn = document.querySelector('.add-form-button');

      const nowDate = new Date().toLocaleString('ru-RU', {
        day: '2-digit',
        month: '2-digit',
        year: '2-digit',
        hour: '2-digit',
        minute: '2-digit',
      }).replace(/,/, '');

      nameEl.addEventListener('focus', () => {
        nameEl.classList.remove('-form-error');
      });
  
      textEl.addEventListener('focus', () => {
        textEl.classList.remove('-form-error');
      });
  
      addBtn.addEventListener('click', () => {
        if (nameEl.value === '' && textEl.value === '') {
          nameEl.classList.add('-form-error');
          textEl.classList.add('-form-error');
          return;
        } else if (nameEl.value === '') {
          nameEl.classList.add('-form-error');
          return;
        } else if (textEl.value === '') {
          textEl.classList.add('-form-error');
          return;
        }
  
        comments.push({name: nameEl.value, data: nowDate, text: textEl.value, counter: 0, like: false});
  
        nameEl.value = '';
        textEl.value = '';
  
        commentRendering();
        likeButtons();
      });
    };
    newComment();

    commentRendering();
    likeButtons();
  </script>
</html>
